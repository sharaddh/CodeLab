<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeetCode Revision Lab — All Problems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#0a0a0a;--panel:#181818;--panel2:#232323;--line:#333333;--text:#f5f5f5;--muted:#a1a1a1;--violet:#ffa116;--cyan:#d7d7d7;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--orange:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.navbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:0 22px;height:52px;background:#1a1a1a;border-bottom:1px solid #333333;backdrop-filter:blur(12px)}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;color:#fff;cursor:pointer;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#2b2b2b;border:1px solid #3d3d3d;color:#fbbf24;font-weight:900;font-size:16px}
.logo svg{width:16px;height:16px}
.navLinks{display:flex;gap:2px}
.navLinks button{border:0;background:none;color:#a5a5a5;padding:0 14px;height:52px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;border-bottom:2px solid transparent;white-space:nowrap}
.navLinks button:hover{color:#ececec}
.navLinks button.active{color:#fbbf24;border-bottom-color:#fbbf24}
.navLinks button svg{width:15px;height:15px}
.navRight{margin-left:auto;display:flex;align-items:center;gap:14px}
.navBadge{font-size:12px;color:#a5a5a5;font-family:'JetBrains Mono',monospace}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;display:grid;place-items:center;font-weight:800;font-size:13px;cursor:pointer;border:2px solid #3d3d3d}
.avatar:hover{border-color:#fbbf24}
.main{padding:24px 28px;padding-bottom:60px;max-width:1500px;width:100%;margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}
.hero>div{flex:1;min-width:0}
.eyebrow{color:#fbbf24;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 0}
.hero p{color:var(--muted);margin:7px 0 0;font-size:13.5px;max-width:760px;line-height:1.6}
.quote{margin-top:20px;padding:18px 22px;border-left:4px solid var(--violet);background:linear-gradient(180deg,#161616,#0f0f0f);border-radius:0 14px 14px 0;max-width:820px}
.quoteText{font-size:clamp(20px,2.6vw,34px);font-weight:800;line-height:1.2;color:#f5f5f5;text-transform:uppercase;letter-spacing:.01em}
.quoteBy{margin-top:9px;font-size:13px;color:#ffc24d;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:58px;z-index:4;padding:9px;background:#161616e8;border:1px solid var(--line);backdrop-filter:blur(15px);border-radius:13px;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%}
.search svg{position:absolute;left:12px;top:11px;color:#888888;width:16px;height:16px}
.search input,.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#101010;color:#fff;outline:none;font-size:13px}
.search input{padding-left:37px}
.toolbar select{width:auto;max-width:190px}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#101010;color:var(--muted);white-space:nowrap;font-size:13px}
.chip.active{background:#ffa11622;color:#eeeeee;border-color:#ffa11680}
.btn{border:1px solid var(--line);background:var(--panel2);color:#e2e2e2;padding:9px 13px;border-radius:9px;display:inline-flex;gap:7px;align-items:center;font-size:13px;transition:.15s}
.btn:hover{background:#2d2d2d}
.btn.primary{background:var(--violet);border-color:transparent;color:#141414;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px}
.stat b{font-size:18px;display:block}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,#1a1a1a,#141414);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .3s ease both;transition:.15s}
.card:hover{border-color:#4a4a4a;transform:translateY(-2px)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0;font-size:15px;line-height:1.35}
.card .topics{color:var(--muted);font-size:12px;line-height:1.5;min-height:34px}
.card .comps{color:#8a8a8a;font-size:11px}
.cardActions{display:flex;gap:8px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.badge.easy{color:#7ee2a8;background:#10b9811c;border-color:#10b98155}
.badge.medium{color:#fcd07d;background:#f59e0b1c;border-color:#f59e0b55}
.badge.hard{color:#ff9aa8;background:#ef44441c;border-color:#ef444455}
.badge.premium{color:#ffd54d;background:#ffb3001c;border-color:#ffb30066}
.num{color:#8a8a8a;font-weight:700;font-size:12px;font-family:'JetBrains Mono',monospace}
.strategy{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#161616}
.strategyHead{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.strategyHead:hover{background:#191919}
.strategy.open .strategyHead{background:#ffa1160d}
.strategy h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:center}
.strategy .complex{font-size:12px;color:var(--muted);display:flex;gap:10px;font-family:'JetBrains Mono',monospace}
.strategyBody{display:none;padding:4px 16px 16px}
.strategy.open .strategyBody{display:block}
.idea{color:#d3d3d3;font-size:13.5px;line-height:1.7;margin:8px 0 12px}
.idea p{margin:0 0 8px}
.codeTabs{display:flex;gap:6px;margin-bottom:8px}
.codeTabs .tab{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600}
.codeTabs .tab.active{background:#c9c9c91c;color:#e8e8e8;border-color:#c9c9c955}
.solCode{background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;overflow:auto;color:#d8d8d8;white-space:pre;max-height:380px;position:relative}
.loadBtn{position:absolute;top:8px;right:8px;font-size:11px}
.strategyHead .chev{transition:.2s;color:var(--muted)}
.strategy.open .chev{transform:rotate(90deg)}
.editorial{border:1px solid var(--line);border-radius:12px;padding:16px;background:#161616;margin-bottom:12px}
.editorial h3{color:#d9d9d9;margin:0 0 8px;font-size:15px}
.md{color:#d3d3d3;font-size:13.5px;line-height:1.75}
.md p{margin:0 0 10px}
.md code{background:#1f1f1f;padding:2px 6px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#dedede}
.md pre{background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:#d8d8d8;line-height:1.5}
.md ul,.md ol{margin:6px 0 10px;padding-left:20px}
.md li{margin:3px 0}
.md strong{color:#fff}
.md em{color:#a0a0a0}
.note{margin:8px 0 16px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12.5px;line-height:1.6;background:#161616}
.companies{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.company{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#171717;cursor:pointer;transition:.15s}
.company:hover{border-color:#ffa11680;transform:translateY(-2px)}
.company b{display:block;font-size:14px}
.company span{color:var(--muted);font-size:12px}
.searchBlock{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.premiumBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2d2d2d;border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.freqCol{color:#ffd08a}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.listCard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#121212}
.trow{display:grid;grid-template-columns:64px 1fr 78px 84px 116px 120px;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #242424;min-height:56px}
.trow:last-child{border-bottom:0}
.trow:hover{background:#191919}
.trow.thead{background:#101010;min-height:40px;cursor:default}
.loadMore{text-align:center;padding:16px;cursor:pointer;color:#e8e8e8;font-size:13px;background:#161616;border-bottom:1px solid #242424}
.loadMore:hover{background:#232323;color:#f2f2f2}
.trow.thead span{color:#8c8c8c;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ttl b{color:#e8e8e8;font-size:14.5px;font-weight:600;cursor:pointer}
.ttl b:hover{color:#fbbf24}
.topics{color:#7a7a7a;font-size:12px;margin-top:3px}
.solBadge{font-size:11.5px;color:#fbbf24;font-weight:700;white-space:nowrap}
.solBadge svg{width:13px;height:13px;vertical-align:-2px}
.freq{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#999999}
.trow .badge{justify-self:start}
.profile{max-width:1100px;width:100%}
.proHead{display:flex;gap:22px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.proAvatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;font-weight:900;font-size:32px;color:#1a1a1a;flex:none;box-shadow:0 0 46px #fbbf2418}
.proName{font-size:22px;font-weight:800;background:transparent;border:0;color:#fff;outline:none;border-bottom:2px dashed transparent;width:240px}
.proName:hover,.proName:focus{border-bottom-color:#3d3d3d}
.proTag{color:var(--muted);font-size:13px;margin-top:4px}
.proActions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rings{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 6px}
.ringWrap{display:flex;flex-direction:column;align-items:center;gap:7px}
.ringLabel{font-size:12px;color:var(--muted);font-weight:700}
.proGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.pstat{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px}
.pstat b{font-size:24px;display:block;font-family:'JetBrains Mono',monospace}
.pstat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sectionT{font-size:15px;font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sectionT svg{width:17px;height:17px;color:#fbbf24}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.recentWrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#121212}
.recentRow{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid #242424;cursor:pointer}
.recentRow:last-child{border-bottom:0}
.recentRow:hover{background:#191919}
.recentRow .when{color:#7a7a7a;font-size:12px;margin-left:auto;font-family:'JetBrains Mono',monospace}
@media(max-width:1100px){
.navbar{gap:10px;padding:0 12px;overflow-x:auto}
.navLinks button{padding:0 10px}
.main{padding:16px}
.hero{flex-direction:column;align-items:flex-start;gap:14px}
.quote{max-width:100%}
.quoteText{font-size:clamp(18px,2.5vw,28px)}
.pGrid{grid-template-columns:1fr;overflow:visible}
.pLeft{border-right:0;border-bottom:1px solid var(--line)}
.pRight{min-height:60vh}
.dGrid{grid-template-columns:1fr}
.dSide{border-left:0;border-top:1px solid var(--line);grid-auto-flow:row}
.grip-v{display:none}
.trow{grid-template-columns:40px 1fr 90px 80px;min-height:52px}
.trow .freq,.trow .solBadge,.trow.thead span:nth-child(3),.trow.thead span:nth-child(4),.trow>*:nth-child(4){display:none}
.proHead{gap:14px}
.rings{gap:16px}
}
@media(max-width:768px){
.navbar{height:48px;padding:0 10px}
.navLinks button{padding:0 8px;font-size:12px;height:48px}
.navRight{gap:8px}
.main{padding:12px}
.hero{margin-bottom:10px}
.hero .btn{width:100%;justify-content:center}
.toolbar{top:52px;gap:6px;padding:7px}
.search{min-width:160px}
.search input{font-size:13px}
.toolbar select{font-size:12px;max-width:140px}
.stats{gap:6px;margin:10px 0}
.stat{padding:8px 10px;border-radius:10px}
.stat b{font-size:15px}
.stat span{font-size:10px}
.trow{grid-template-columns:32px 1fr 70px;min-height:48px;padding:0 10px}
.trow .freq,.trow .solBadge,.trow.thead span:nth-child(3),.trow.thead span:nth-child(4),.trow.thead span:nth-child(5),.trow>*:nth-child(3),.trow>*:nth-child(4),.trow>*:nth-child(5){display:none}
.listCard{border-radius:10px}
.card{padding:12px;border-radius:10px}
.card h3{font-size:14px}
.pHead{padding:8px 12px;gap:8px}
.pHead h2{font-size:16px}
.pMode{padding:0 8px}
.tab{padding:10px 10px;font-size:12px}
.editorTop{padding:6px 10px}
.controls{padding:8px 10px}
#code{padding:12px;font-size:12px}
.statement{padding:14px}
.statement h3{font-size:11px}
.description{font-size:13px}
.example{font-size:11.5px;padding:8px 10px}
.strategyHead{padding:10px 12px}
.strategyBody{padding:4px 12px 12px}
.solCode{padding:10px;font-size:11.5px;max-height:280px}
.proAvatar{width:72px;height:72px;font-size:26px}
.proName{font-size:18px;width:200px}
.proGrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pstat{padding:12px}
.pstat b{font-size:20px}
.recentRow{padding:9px 12px;font-size:13px}
.companies{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.company{padding:10px 12px;border-radius:10px}
.company b{font-size:13px}
.company span{font-size:11px}
}
@media(max-width:480px){
.navbar{height:44px;padding:0 8px}
.brandName{font-size:13px}
.navLinks{gap:0}
.navLinks button{padding:0 6px;font-size:11px;height:44px}
.navLinks button svg{display:none}
.main{padding:8px}
.quote{padding:12px 14px;border-radius:0 10px 10px 0}
.quoteText{font-size:16px;letter-spacing:0}
.toolbar{top:46px;flex-direction:column;gap:5px;padding:6px}
.search{min-width:100%}
.toolbar select{max-width:100%;width:100%}
.chip{font-size:12px;padding:7px 10px}
.stats{gap:4px}
.stat{padding:6px 8px;border-radius:8px}
.stat b{font-size:13px}
.stat span{font-size:9px}
.trow{grid-template-columns:28px 1fr 60px;min-height:44px;padding:0 8px;gap:6px;font-size:12px}
.trow .ttl b{font-size:12.5px}
.pHead{flex-wrap:wrap}
.pGrid{grid-template-columns:1fr!important}
.dGrid{grid-template-columns:1fr!important}
.traceList{height:120px}
.player{flex-wrap:wrap;gap:5px}
.companies{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="navbar">
    <div class="brand" onclick="location.href='index.html'"><div class="logo"><i data-lucide="code-2"></i></div><span class="brandName">LeetCode <span style="color:#fbbf24">Revision Lab</span></span></div>
    <div class="navLinks">
      <button class="active" data-view="browse" onclick="location.href='index.html'"><i data-lucide="list"></i>Problems</button>
      <button data-view="companies" onclick="location.href='companies.html'"><i data-lucide="building-2"></i>Companies</button>
      <button data-view="premium" onclick="location.href='premium.html'"><i data-lucide="crown"></i>Premium</button>
      <button data-view="top" onclick="location.href='top.html'"><i data-lucide="flame"></i>Top 160</button>
      <button data-view="reviewed" onclick="location.href='reviewed.html'"><i data-lucide="check-circle-2"></i>Reviewed</button>
      <button data-view="profile" onclick="location.href='profile.html'"><i data-lucide="user"></i>Profile</button>
    </div>
    <div class="navRight">
      <span class="navBadge" id="navBadge"></span>
      <button class="btn sm" onclick="randomProblem()"><i data-lucide="shuffle"></i> Random</button>
      <div class="avatar" id="avatar" title="Profile" onclick="location.href='profile.html'">GU</div>
    </div>
  </nav>
  <main class="main">
    <section class="hero">
      <div>
        <div class="quote" id="quoteBox">
          <div class="quoteText">AAJ KAMAYENGA TO KAL KAHYENGE, AA MERI JAaN</div>
          <div class="quoteBy">— Sharad Rathore</div>
        </div>
      </div>
      <button class="btn primary" onclick="randomProblem()"><i data-lucide="shuffle"></i> Random problem</button>
    </section>
    <div class="toolbar" id="toolbar">
      <div class="search"><i data-lucide="search"></i><input id="q" placeholder="Search id, title, topic or company…" oninput="render()"></div>
      <select id="diff" onchange="render()"><option value="all">All difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
      <select id="topic" onchange="render()"><option value="all">All topics</option></select>
      <select id="company" onchange="render()"><option value="all">All companies</option></select>
      <select id="stf" onchange="render()"><option value="all">Status: All</option><option value="reviewed">Reviewed</option><option value="not">Not reviewed</option></select>
      <select id="sort" onchange="render()"><option value="id">Sort: ID</option><option value="freq">Sort: Frequency</option></select>
      <button class="chip" id="premChip" onclick="togglePremium()">Premium</button>
    </div>
    <div class="stats" id="stats"></div>
    <section id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="js/shared.js"></script>
<script>
var problems=[],companies=[],topics=[],stats=null,filtered=[],shownCount=300;
var curatedBySlug=new Set();
var reviewed=JSON.parse(localStorage.getItem('lc-rv2')||'{}');
var top160Ids=[];
function currentFilters(){
  return {q:$('q').value,d:$('diff').value,t:$('topic').value,c:$('company').value,sort:$('sort').value,s:$('stf').value,prem:!!$('premChip').classList.contains('active')};
}
async function init(){
  try{
    const [p,c,t,s,sol]=await Promise.all([
      fetch('/api/problems?max=5000').then(r=>r.json()),
      fetch('/api/companies').then(r=>r.json()),
      fetch('/api/topics').then(r=>r.json()),
      fetch('/api/stats').then(r=>r.json()),
      fetch('/api/solutions').then(r=>r.json())
    ]);
    problems=p.problems||p;companies=c;topics=t;stats=s;
    top160Ids=sol.solutions.map(x=>problems.find(q=>q.slug===x.slug)).filter(Boolean).map(x=>x.id);
    curatedBySlug=new Set(sol.solutions.map(x=>x.slug));
    $('topic').innerHTML='<option value="all">All topics</option>'+t.map(x=>'<option>'+esc(x)+'</option>').join('');
    $('company').innerHTML='<option value="all">All companies</option>'+companies.map(x=>'<option>'+esc(x.name)+'</option>').join('');
    updateProfileChrome();
    render();
  }catch(e){
    $('content').innerHTML='<div class="stat">Failed to load dataset: '+esc(e.message)+'.<br><br>Start the server with <b>npm start</b> and refresh.</div>';
  }
  bindSplits();
  initLucide();
}
function applyViewExtras(f){
  const page = new URLSearchParams(window.location.search).get('view') || 'browse';
  if(page==='premium')f.prem=true;
  if(page==='top')f.top160=true;
}
function render(){
  const f=currentFilters();applyViewExtras(f);
  const q=f.q.toLowerCase();
  let list=problems;
  if(f.d!=='all')list=list.filter(p=>p.difficulty===f.d);
  if(f.t!=='all')list=list.filter(p=>(p.topics||[]).some(x=>String(x.name||x)===f.t));
  if(f.c!=='all')list=list.filter(p=>(p.companies||[]).some(c=>c.name.toLowerCase()===f.c.toLowerCase()));
  if(f.prem)list=list.filter(p=>p.paidOnly);
  if(f.s==='reviewed')list=list.filter(p=>reviewed[p.id]);
  if(f.s==='not')list=list.filter(p=>!reviewed[p.id]);
  if(f.top160)list=list.slice(0,0).concat(top160Ids.map(id=>problems.find(p=>p.id===id)).filter(Boolean));
  if(q)list=list.filter(p=>`${p.id} ${p.title} ${(p.topics||[]).map(x=>x.name||x).join(' ')} ${(p.companies||[]).map(c=>c.name).join(' ')}`.toLowerCase().includes(q));
  if(f.sort==='freq')list=[...list].sort((a,b)=>(b.askedBy-a.askedBy)||(b.frequency-a.frequency)||(Number(a.id)-Number(b.id)));
  else list=[...list].sort((a,b)=>Number(a.id)-Number(b.id));
  filtered=list;
  shownCount=300;
  renderCards(list);
  const c={Easy:0,Medium:0,Hard:0};problems.forEach(p=>{if(p.difficulty)c[p.difficulty]++});
  const n=Object.values(reviewed).filter(Boolean).length;
  $('stats').innerHTML=`<div class="stat"><b>${list.length.toLocaleString()}</b><span>shown</span></div><div class="stat"><b>${c.Easy||0}</b><span>easy</span></div><div class="stat"><b>${c.Medium||0}</b><span>medium</span></div><div class="stat"><b>${c.Hard||0}</b><span>hard</span></div><div class="stat"><b>${n}</b><span>reviewed</span></div><div class="stat"><b>${problems.filter(p=>p.paidOnly).length}</b><span>premium</span></div>`;
  updateProfileChrome();
  initLucide();
}
function renderCards(list){
  if(!list.length){$('content').innerHTML='<div class="stat">No problems match.</div>';return}
  const rows=list.slice(0,shownCount).map((p,i)=>{
    const sol=curatedBySlug.has(p.slug);
    const rv=!!reviewed[p.id];
    const comps=(p.companies||[]).slice(0,3).map(c=>c.name).join(', ');
    return `<div class="trow" style="animation:fadeIn .25s ease both;animation-delay:${Math.min(i*4,120)}ms" onclick="openProblem('${esc(p.slug)}')">
      <span class="num" style="display:flex;align-items:center;gap:6px">${p.paidOnly?'<i data-lucide="crown" style="width:13px;height:13px;color:#ffd54d;flex:none"></i>':''}${p.id}</span>
      <span class="ttl"><b>${esc(p.title)}</b><div class="topics">${esc((p.topics||[]).slice(0,4).map(x=>x.name||x).join(' · '))}${comps?' <span style="color:#8a8a8a">· '+esc(comps)+'</span>':''}</div></span>
      <span class="solBadge">${sol?'<i data-lucide="check-check"></i> sol':''}</span>
      <span class="freq">${p.askedBy?('+'+p.askedBy):'—'}</span>
      <span class="badge ${p.difficulty.toLowerCase()}">${esc(p.difficulty)}</span>
      <span onclick="event.stopPropagation()"><button class="btn sm" onclick="toggleReview(${p.id})">${rv?'<i data-lucide="check-circle-2"></i> Reviewed':'Review'}</button></span>
    </div>`;
  }).join('');
  const more=shownCount<list.length?`<div class="loadMore" onclick="loadMore()"><b>Load more</b> — showing ${shownCount} of ${list.length.toLocaleString()} problems</div>`:'';
  $('content').innerHTML=`<div class="listCard"><div class="trow thead"><span>No.</span><span>Title</span><span>Solution</span><span>Freq</span><span>Difficulty</span><span></span></div>${rows}${more}</div>`;
  initLucide();
}
function loadMore(){
  shownCount+=300;
  renderCards(filtered);
  const el=document.querySelector('.loadMore');
  if(el)el.scrollIntoView({block:'nearest'});
}
function togglePremium(){$('premChip').classList.toggle('active');render()}
function openProblem(slug){location.href='problem.html?slug='+encodeURIComponent(slug)}
function randomProblem(){if(problems.length)openProblem(problems[Math.floor(Math.random()*problems.length)].slug)}
function toggleReview(id){if(reviewed[id])delete reviewed[id];else reviewed[id]=Date.now();localStorage.setItem('lc-rv2',JSON.stringify(reviewed));render()}
init();
</script>
</body>
</html>
